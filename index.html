<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Room の受け取り</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:620px;margin:8vh auto;padding:0 20px;color:#252525}input,button{font:inherit;padding:10px}input{width:min(90%,25em)}button{margin-top:12px}small{display:block;color:#666}#status{min-height:2em}</style></head><body><h1>Agent Room のコードを受け取る</h1><p>合言葉を入力すると、この端末内で暗号を解いてZIPを保存します。</p><label>合言葉<br><input id="password" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><br><button id="download">ZIPをダウンロード</button><p id="status" role="status"></p><small>合言葉はこのページから送信されません。暗号化ファイルは公開されており、合言葉を知る人だけが復号できます。</small><script>
document.getElementById('download').onclick=async()=>{const status=document.getElementById('status');const button=document.getElementById('download');button.disabled=true;status.textContent='ファイルを取得しています…';try{const phrase=document.getElementById('password').value.replace(/[\s-]/g,'').toUpperCase();if(!phrase)throw Error('合言葉を入力してください。');const response=await fetch('agent_room.enc',{cache:'no-store'});if(!response.ok)throw Error('暗号化ファイルを取得できません。');const bytes=new Uint8Array(await response.arrayBuffer());if(new TextDecoder().decode(bytes.slice(0,4))!=='AR01')throw Error('ファイル形式が違います。');status.textContent='暗号を解いています…';const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(phrase),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(4,20),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(20,32)},key,bytes.slice(32));const url=URL.createObjectURL(new Blob([plain],{type:'application/zip'}));const a=document.createElement('a');a.href=url;a.download='agent_room.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='ZIPを保存しました。';}catch(e){status.textContent=e.name==='OperationError'?'合言葉が違うか、ファイルが壊れています。':e.message;}finally{button.disabled=false;}};
</script></body></html>
